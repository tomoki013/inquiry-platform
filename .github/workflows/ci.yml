name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Checks only. This repository has no deployment of its own: each deployment
# deploys a tagged release with its own configuration
# (docs/operations/deployment.md).
jobs:
  check:
    name: Lint, check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
